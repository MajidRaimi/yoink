name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/tokens/**"
      - "docs/**"
      - "apps/cli/package.json"
      - "apps/cli/src/features/providers/**"
      - "apps/cli/src/features/harnesses/**"
      - "apps/cli/src/features/subscriptions/**"
      - "apps/cli/src/features/profiles/**"
      - "apps/cli/src/features/menu/**"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - ".github/workflows/deploy.yml"
  workflow_run:
    workflows: ["Desktop Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save the live sitemap for IndexNow
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/indexnow"
          curl -fsSL --max-time 30 https://yoink.codes/sitemap.xml -o "$RUNNER_TEMP/indexnow/previous-sitemap.xml" || rm -f "$RUNNER_TEMP/indexnow/previous-sitemap.xml"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - name: Stage sitemaps for IndexNow
        continue-on-error: true
        run: cp apps/web/out/sitemap.xml "$RUNNER_TEMP/indexnow/sitemap.xml"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-sitemaps
          path: ${{ runner.temp }}/indexnow
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yoink.codes
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Retry deployment if it flaked
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: apps/web
      - uses: oven-sh/setup-bun@v2
        continue-on-error: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-sitemaps
          path: ${{ runner.temp }}/indexnow
      - name: Ping IndexNow
        continue-on-error: true
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          previous="$RUNNER_TEMP/indexnow/previous-sitemap.xml"
          if [ -f "$previous" ]; then
            bun run scripts/indexnow.ts --sitemap "$RUNNER_TEMP/indexnow/sitemap.xml" --previous "$previous"
          else
            bun run scripts/indexnow.ts --sitemap "$RUNNER_TEMP/indexnow/sitemap.xml"
          fi
